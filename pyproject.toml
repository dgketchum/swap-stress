[project]
name = "swap-stress"
version = "0.1.0"
description = "Soil Water Retention Curve modeling and stress analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # Core scientific
    "numpy",
    "pandas",
    "scipy",
    "lmfit",
    "xarray",
    # Geospatial
    "geopandas",
    "shapely",
    "pyproj",
    "earthengine-api",
    # Visualization
    "matplotlib",
    "seaborn",
    "pillow",
    "visualtorch",
    # Machine learning
    "torch",
    "scikit-learn",
    "lightning",
    "joblib",
    # Data access
    "ismn",
    "openet-ptjpl",
    "earthaccess",
    "requests",
    # Raster I/O
    "rasterio",
    "h5py",
    # Utilities
    "tqdm",
    "pyarrow",
    "tomli; python_version < '3.11'",
    "quantile-forest>=1.4.1",
    "pymc>=5.25.1",
    "mgrs>=1.5.4",
    "cairosvg>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "av>=13.1",
    "imageio>=2.37.3",
    "openpyxl>=3.1.5",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["swapstress", "research"]

[tool.pytest.ini_options]
# research/ is preserved exploratory work, not part of the reproduction path.
# Its tests move with it and are not run by default.
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["research"]
