[project]
name = "swap-stress"
version = "0.1.0"
description = "Soil Water Retention Curve modeling and stress analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # Core scientific
    "numpy",
    "pandas",
    "scipy",
    "lmfit",
    "xarray",

    # Geospatial
    "geopandas",
    "shapely",
    "pyproj",
    "earthengine-api",

    # Visualization
    "matplotlib",
    "seaborn",
    "pillow",
    "visualtorch",

    # Machine learning
    "torch",
    "scikit-learn",
    "lightning",
    "joblib",

    # Data access
    "ismn",
    "openet-ptjpl",
    "earthaccess",
    "requests",

    # Raster I/O
    "rasterio",
    "h5py",

    # Utilities
    "tqdm",
    "pyarrow",
    "tomli; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = [
    "et",
    "map",
    "poster",
    "retention_curve",
    "site_modeling",
    "utils",
    "viz",
    "vwc_series",
]
